<VirtualHost *:80>
    DocumentRoot /opt/agent-automation/public
    DirectoryIndex index.php
    LimitRequestBody 262144

    <Directory /opt/agent-automation/public>
        Options -Indexes -FollowSymLinks
        AllowOverride None
        Require all granted
        CGIPassAuth On
        FallbackResource /index.php

        <FilesMatch "^(router\.php|workbench\.html)$">
            Require all denied
        </FilesMatch>
    </Directory>
</VirtualHost>
